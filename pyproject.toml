[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hormone-sim"
version = "0.1.0"
description = "Population PK/PD simulation of gender-affirming hormone therapy (research/education)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hormone-sim contributors" }]
keywords = ["pharmacokinetics", "pharmacodynamics", "gender-affirming", "hormone-therapy", "transdermal", "estradiol"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
hormone-sim = "hormone_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
